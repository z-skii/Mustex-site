<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUSTEX — Read between the lines</title>
<meta name="description" content="MUSTEX reads a screenshot of your conversation and gives you an honest, structured verdict." />
<meta name="theme-color" content="#0b0b0f" />
<meta property="og:title" content="MUSTEX" />
<meta property="og:description" content="Read between the lines." />
<meta property="og:type" content="website" />
<style>
  /* Palette lifted from the app's theme.ts so web and app read as one product. */
  :root {
    --bg: #0b0b0f;
    --surface: #15151c;
    --border: #2a2a35;
    --text: #ffffff;
    --body: #d7d7e0;
    --dim: #9a9aa5;
    --faint: #66667a;
    --accent: #6c5ce7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  /* A soft accent bloom behind the wordmark, same accentSoft family as the app. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(60% 45% at 50% 22%, rgba(108, 92, 231, 0.20), transparent 70%);
    pointer-events: none;
  }
  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px 24px;
  }
  .wordmark {
    margin: 0;
    color: var(--text);
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 9px;
    line-height: 1.05;
  }
  .tagline {
    margin: 12px 0 0;
    color: var(--faint);
    font-size: 13px;
    letter-spacing: 0.6px;
  }
  .rule {
    width: 56px;
    height: 2px;
    margin: 24px 0;
    background: var(--accent);
    border-radius: 2px;
  }
  .desc {
    margin: 0;
    max-width: 30rem;
    font-size: 17px;
    line-height: 1.6;
    color: var(--body);
  }
  .contact {
    margin-top: 36px;
    padding: 14px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .contact a {
    display: block;
    margin-top: 6px;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    text-decoration: none;
  }
  .contact a:hover { color: var(--accent); }
  footer {
    position: relative;
    padding: 24px;
    text-align: center;
    font-size: 13px;
    color: var(--faint);
  }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  @media (max-width: 420px) {
    .wordmark { font-size: 32px; letter-spacing: 6px; }
    .desc { font-size: 16px; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">MUSTEX</h1>
    <p class="tagline">Read between the lines</p>
    <div class="rule"></div>
    <p class="desc">
      MUSTEX reads a screenshot of your conversation and gives you an honest, structured
      verdict &mdash; the signals, the effort balance, and what to send next.
    </p>
    <p class="contact">
      Contact
      <a href="mailto:molol098765@gmail.com">molol098765@gmail.com</a>
    </p>
  </main>
  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
